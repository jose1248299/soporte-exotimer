name: soporte-exotimer
region: nyc
features:
  - buildpack-stack=ubuntu-22

ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: api
        preserve_path_prefix: true
    - match:
        path:
          prefix: /health
      component:
        name: api
        preserve_path_prefix: true
    - match:
        path:
          prefix: /
      component:
        name: web

services:
  - name: api
    environment_slug: node-js
    git:
      repo_clone_url: https://github.com/jose1248299/soporte-exotimer.git
      branch: main
    build_command: npm install && npm run prisma:generate
    run_command: npm run prisma:deploy && npm run prisma:seed-policies && npm start
    http_port: 4000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
      initial_delay_seconds: 20
      period_seconds: 30
      timeout_seconds: 5
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
      - key: DATABASE_URL
        value: ${soporte-db.DATABASE_PRIVATE_URL}
        scope: RUN_AND_BUILD_TIME
      - key: META_ACCESS_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: META_WABA_ID
        value: "961163613425275"
        scope: RUN_TIME
      - key: META_PHONE_NUMBER_ID
        value: "1159576543903263"
        scope: RUN_TIME
      - key: META_GRAPH_VERSION
        value: v25.0
        scope: RUN_TIME
      - key: META_WEBHOOK_VERIFY_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: OPENAI_MODEL
        value: gpt-4.1
        scope: RUN_TIME
      - key: EXOTIMER_API_BASE_URL
        value: https://raceline.app
        scope: RUN_TIME
      - key: EXOTIMER_API_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: EXOTIMER_API_USER
        scope: RUN_TIME
        type: SECRET
      - key: EXOTIMER_API_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: PUBLIC_BASE_URL
        value: ${_self.PUBLIC_URL}
        scope: RUN_TIME

static_sites:
  - name: web
    environment_slug: node-js
    git:
      repo_clone_url: https://github.com/jose1248299/soporte-exotimer.git
      branch: main
    source_dir: frontend
    build_command: npm install && npm run build
    output_dir: dist

databases:
  - name: soporte-db
    engine: PG
    version: "16"
    production: true
    cluster_name: soporte-exotimer-db
    db_name: soporte_exotimer
    db_user: soporte_exotimer

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
